<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- 
    FIX iOS ZOOM:
    - maximum-scale=1 → mencegah Safari zoom saat input di-tap
    - user-scalable=no → disable pinch zoom (opsional, tapi fix paling ampuh)
    - shrink-to-fit=no → mencegah Safari menyusutkan layout
    - viewport-fit=cover → untuk notch iPhone
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Aplikasi Keuangan</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* Cegah scroll horizontal di level root */
    html, body {
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
    }

    /* Sembunyikan scrollbar tapi tetap bisa scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    body { 
      overscroll-behavior: none;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Pastikan semua tabel tidak melebihi container */
    table {
      table-layout: auto;
      word-break: break-word;
    }

    /* 
      FIX iOS ZOOM - ROOT CAUSE UTAMA:
      iOS Safari auto-zoom jika font-size input < 16px.
      Rule ini memastikan SEMUA input, select, textarea 
      SELALU minimum 16px — termasuk saat focus.
      !important diperlukan untuk override Tailwind inline styles.
    */
    input,
    select,
    textarea,
    input:focus,
    select:focus,
    textarea:focus {
      font-size: 16px !important;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* 
      EXCEPTION: Input nominal yang memang butuh font besar (20px+).
      Tetap 16px+ sehingga iOS tidak zoom, tapi bisa override via JS
      untuk tampilan visual saja.
      Solusi: biarkan 16px untuk anti-zoom, tampilkan besar via padding.
    */
    #kas-nominal-visual,
    #klinik-omset-visual,
    #aset-total-visual {
      font-size: 20px !important; /* 20px > 16px threshold → aman, tidak zoom */
    }

    /* Bottom nav dengan safe area iPhone X+ */
    .bottom-nav-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Konten utama tidak bisa overflow ke kanan */
    main {
      overflow-x: hidden;
      width: 100%;
      box-sizing: border-box;
    }

    /* Wrapper tabel scroll hanya horizontal di dalam box */
    .table-scroll-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }

    /* SweetAlert2 fix untuk iOS */
    .swal2-popup {
      width: 90% !important;
      max-width: 400px !important;
    }
    .swal2-input {
      font-size: 16px !important; /* Cegah zoom di iOS */
    }

    /* 
      FIX TAMBAHAN: Cegah iOS zoom pada SweetAlert2 inputs
      yang dirender dinamis di dalam popup
    */
    .swal2-popup input,
    .swal2-popup select,
    .swal2-popup textarea {
      font-size: 16px !important;
    }

    /* Prevent text size adjustment di iOS */
    * {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
  </style>
</head>

<body class="bg-rose-50 min-h-screen">

  <!-- ===== NAVIGASI BAWAH (Bottom Nav) ===== -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-pink-100 shadow-lg bottom-nav-safe">

  <!-- ===== SCRIPT NAVIGASI ===== -->
  <script>
    window.onload = function () {
      pindahMenu('aruskas');
    };

    function pindahMenu(targetMenu) {
      document.getElementById('container-master').classList.add('hidden');
      document.getElementById('container-transaksi').classList.add('hidden');
      document.getElementById('container-report').classList.add('hidden');
      document.getElementById('container-aruskas').classList.add('hidden');

      const clsNonAktif = "flex-1 flex flex-col items-center p-2 text-gray-400 hover:text-pink-400 transition-colors";
      document.getElementById('btn-nav-master').className    = clsNonAktif;
      document.getElementById('btn-nav-transaksi').className = clsNonAktif;
      document.getElementById('btn-nav-report').className    = clsNonAktif;
      document.getElementById('btn-nav-aruskas').className   = clsNonAktif;

      const clsAktif = "flex-1 flex flex-col items-center p-2 text-pink-600 transition-colors transform scale-105";

      if (targetMenu === 'aruskas') {
        document.getElementById('container-aruskas').classList.remove('hidden');
        document.getElementById('btn-nav-aruskas').className = clsAktif;
        document.getElementById('headerTitle').innerText = "Arus Kas (Cash Flow)";
        if (typeof initModulArusKas === "function") initModulArusKas();
      }
      else if (targetMenu === 'transaksi') {
        document.getElementById('container-transaksi').classList.remove('hidden');
        document.getElementById('btn-nav-transaksi').className = clsAktif;
        document.getElementById('headerTitle').innerText = "Pencatatan Transaksi";
        if (typeof initModulTransaksi === "function") initModulTransaksi();
      }
      else if (targetMenu === 'report') {
        document.getElementById('container-report').classList.remove('hidden');
        document.getElementById('btn-nav-report').className = clsAktif;
        document.getElementById('headerTitle').innerText = "Laporan & PNL";
        if (typeof initModulReport === "function") initModulReport();
      }
      else if (targetMenu === 'master') {
        document.getElementById('container-master').classList.remove('hidden');
        document.getElementById('btn-nav-master').className = clsAktif;
        document.getElementById('headerTitle').innerText = "Master Database";
        if (typeof initModulMaster === "function") initModulMaster();
      }
    }
  </script>
