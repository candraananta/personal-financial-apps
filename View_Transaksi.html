<!-- KONTEN: View_Transaksi.html
     PERBAIKAN v2:
       - Dropdown COA dikelompokkan per kategori (<optgroup>) [REQ #1]
       - Dropdown Lokasi diurutkan abjad (tidak ada kategori)
       - Dropdown Platform diurutkan abjad
       - Dropdown Kategori diurutkan abjad
       - Dropdown Item dikelompokkan per kategori
       - getRiwayatBeliAktif() mapping kolom diperbaiki [BUG #2 FIX v2]
-->
<section id="modul-transaksi" class="block relative w-full">

  <!-- Pemilih Jenis Transaksi -->
  <div class="bg-white p-4 rounded-2xl shadow-sm border border-pink-100 mb-4 flex items-center gap-3">
    <div class="bg-pink-100 p-3 rounded-xl text-pink-600 flex-shrink-0">
      <i class="fa-solid fa-money-bill-transfer text-xl"></i>
    </div>
    <div class="flex-1 min-w-0">
      <label class="block text-[10px] font-bold text-gray-400 mb-1">MODE PENCATATAN</label>
      <select id="pilihModeTrx" onchange="gantiModeTrx()"
              class="w-full bg-rose-50 border border-pink-200 py-2 px-2 rounded-lg outline-none text-sm font-bold text-rose-900">
        <option value="klinik">Fee Klinik Medis</option>
        <option value="aset">Tabungan Aset (Investasi)</option>
      </select>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- FORM 1: TRANSAKSI KLINIK                                     -->
  <!-- ============================================================ -->
  <div id="form-klinik-container" class="bg-white p-5 rounded-2xl shadow-sm border border-pink-100 mb-20 block w-full">
    <form id="formKlinik" onsubmit="submitTrxKlinik(event)">

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">TANGGAL TRANSAKSI <span class="text-red-500">*</span></label>
        <input type="date" id="klinik-tgl"
               class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none font-bold text-rose-900"
               style="font-size: 16px;" required>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">LOKASI / KLINIK <span class="text-red-500">*</span></label>
        <select id="klinik-lokasi" onchange="kalkulasiKlinik()"
                class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm"
                required>
          <option value="" disabled selected>⏳ Memuat data lokasi...</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">NAMA PASIEN <span class="text-red-500">*</span></label>
        <input type="text" id="klinik-pasien"
               class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm"
               style="font-size: 16px;" placeholder="Nama lengkap pasien" required>
      </div>

      <div class="mb-4 flex items-center justify-between bg-pink-50 p-3 rounded-xl border border-pink-200">
        <div class="flex-1 min-w-0 mr-3">
          <p class="text-xs font-bold text-rose-900"><i class="fa-solid fa-id-card text-pink-500 mr-1"></i> Pasien BPJS?</p>
          <p class="text-[10px] text-pink-600">Full Tarif Masuk Ke Komisi Dokter</p>
        </div>
        <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
          <input type="checkbox" id="klinik-bpjs" onchange="toggleBPJS()" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-pink-600"></div>
        </label>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">TINDAKAN (OPSIONAL)</label>
        <input type="text" id="klinik-tindakan"
               class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm"
               style="font-size: 16px;" placeholder="Misal: Konsultasi / Tindakan Estetik">
      </div>

      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-500 mb-1">TOTAL OMSET (RP) <span class="text-red-500">*</span></label>
        <input type="text" id="klinik-omset-visual"
               oninput="formatVisualAngka(this, 'klinik-omset-raw'); kalkulasiKlinik()"
               class="w-full bg-rose-50 border border-pink-200 py-4 px-4 rounded-xl font-bold text-gray-800 focus:ring-2 focus:ring-pink-500 outline-none text-center"
               style="font-size: 20px;" placeholder="0" required>
        <input type="hidden" id="klinik-omset-raw" value="0">
      </div>

      <!-- Preview kalkulasi -->
      <div class="bg-pink-50 border border-pink-200 rounded-xl p-4 mb-6 grid grid-cols-2 gap-2 text-center divide-x divide-pink-200">
        <div>
          <p class="text-[10px] text-pink-600 font-bold mb-1">KOMISI DOKTER (<span id="txt-persen-klinik">0</span>%)</p>
          <p class="text-sm font-bold text-rose-900 truncate" id="txt-nominal-klinik">Rp 0</p>
        </div>
        <div>
          <p class="text-[10px] text-pink-600 font-bold mb-1">LABA KLINIK</p>
          <p class="text-sm font-bold text-rose-900 truncate" id="txt-laba-klinik">Rp 0</p>
        </div>
      </div>

      <input type="hidden" id="val-persen-klinik"  value="0">
      <input type="hidden" id="val-nominal-klinik" value="0">
      <input type="hidden" id="val-laba-klinik"    value="0">
      <input type="hidden" id="val-cutoff-klinik"  value="0">

      <button type="submit" id="btn-submit-klinik"
              class="w-full bg-pink-600 hover:bg-pink-700 active:bg-pink-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-md text-sm">
        <i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Fee Klinik
      </button>
    </form>
  </div>

  <!-- ============================================================ -->
  <!-- FORM 2: TRANSAKSI TABUNGAN ASET                              -->
  <!-- ============================================================ -->
  <div id="form-aset-container" class="bg-white p-5 rounded-2xl shadow-sm border border-pink-100 mb-20 hidden w-full">
    <form id="formAset" onsubmit="submitTrxAset(event)">

      <input type="hidden" id="val-id-referensi" value="">

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">TANGGAL TRANSAKSI <span class="text-red-500">*</span></label>
        <input type="date" id="aset-tgl"
               class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none font-bold text-rose-900"
               style="font-size: 16px;" required>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">TIPE TRANSAKSI <span class="text-red-500">*</span></label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center justify-center p-3 bg-rose-50 border border-pink-200 rounded-xl cursor-pointer hover:bg-pink-100 has-[:checked]:bg-pink-600 has-[:checked]:text-white transition-colors">
            <input type="radio" name="aset-tipe" value="BELI" class="sr-only" onchange="resetFormBeli()" checked>
            <span class="text-sm font-bold">💰 Beli (Masuk)</span>
          </label>
          <label class="flex items-center justify-center p-3 bg-rose-50 border border-pink-200 rounded-xl cursor-pointer hover:bg-pink-100 has-[:checked]:bg-pink-600 has-[:checked]:text-white transition-colors">
            <input type="radio" name="aset-tipe" value="JUAL" class="sr-only" onchange="bukaGridJual()">
            <span class="text-sm font-bold">📤 Jual (Keluar)</span>
          </label>
        </div>
      </div>

      <!-- Akun COA (hanya untuk BELI) — dikelompokkan per kategori -->
      <div class="mb-4" id="area-coa-aset">
        <label class="block text-xs font-bold text-gray-500 mb-1">AKUN BIAYA (COA) <span class="text-red-500">*</span></label>
        <select id="aset-coa"
                class="w-full bg-pink-50 border border-pink-200 py-3 px-3 rounded-xl outline-none text-sm font-bold text-rose-900">
          <option value="" disabled selected>⏳ Memuat Master COA...</option>
        </select>
        <p class="text-[10px] text-gray-400 mt-1">💡 Dari "Master Pengeluaran Rutin" — tambahkan lewat menu Master</p>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-1">PLATFORM / TEMPAT SIMPAN <span class="text-red-500">*</span></label>
        <select id="aset-platform"
                class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm" required>
          <option value="" disabled selected>⏳ Memuat referensi...</option>
        </select>
      </div>

      <div class="mb-4 grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">KATEGORI <span class="text-red-500">*</span></label>
          <select id="aset-kategori" onchange="filterItemBerdasarkanKategori()"
                  class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm" required>
            <option value="" disabled selected>Pilih...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">NAMA ITEM <span class="text-red-500">*</span></label>
          <select id="aset-item"
                  class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm" required>
            <option value="" disabled selected>Pilih kategori dulu</option>
          </select>
        </div>
      </div>

      <div class="mb-4 grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">KUANTITAS <span class="text-red-500">*</span></label>
          <input type="number" step="any" id="aset-kuantitas" oninput="kalkulasiAset()"
                 class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm font-bold"
                 style="font-size: 16px;" placeholder="Misal: 10" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">TOTAL (RP) <span class="text-red-500">*</span></label>
          <input type="text" id="aset-total-visual"
                 oninput="formatVisualAngka(this, 'aset-total-raw'); kalkulasiAset()"
                 class="w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm font-bold text-rose-900"
                 style="font-size: 16px;" placeholder="0" required>
          <input type="hidden" id="aset-total-raw" value="0">
        </div>
      </div>

      <div class="bg-pink-50 border border-pink-200 rounded-xl p-4 mb-6 text-center">
        <p class="text-[10px] text-pink-600 font-bold mb-1">HARGA EFEKTIF PER UNIT</p>
        <p class="text-2xl font-bold text-gray-700" id="txt-harga-satuan">Rp 0</p>
        <input type="hidden" id="val-harga-satuan" value="0">
      </div>

      <button type="submit" id="btn-submit-aset"
              class="w-full bg-pink-600 hover:bg-pink-700 active:bg-pink-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-md text-sm">
        <i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Transaksi Aset
      </button>
    </form>
  </div>

  <!-- ============================================================ -->
  <!-- MODAL: PILIH LOT ASET UNTUK DIJUAL                           -->
  <!-- ============================================================ -->
  <div id="modal-grid-jual" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 z-[60] flex items-end justify-center p-0 backdrop-blur-sm">
    <div class="bg-white rounded-t-2xl w-full max-w-lg flex flex-col shadow-2xl overflow-hidden"
         style="max-height: 85dvh; max-height: 85vh;">
      <div class="p-4 border-b border-pink-50 flex-shrink-0 flex items-center justify-between">
        <h3 class="text-sm font-bold text-rose-900">
          <i class="fa-solid fa-list-check text-pink-500 mr-2"></i>Pilih Aset Untuk Dijual
        </h3>
        <button type="button" onclick="tutupGridJual()" class="text-gray-400 hover:text-gray-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Filter kategori di dalam modal -->
      <div class="px-4 pt-3 pb-2 border-b border-pink-50 flex-shrink-0">
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
          <button onclick="filterGridJual('semua')" id="jual-chip-semua"
                  class="flex-shrink-0 text-[11px] font-bold px-3 py-1.5 rounded-full border bg-pink-600 text-white border-pink-600 transition-colors">
            Semua
          </button>
          <!-- Chip kategori diisi JS -->
          <div id="jual-chips-kategori" class="flex gap-2 flex-shrink-0"></div>
        </div>
      </div>

      <div class="overflow-y-auto flex-1 no-scrollbar">
        <table class="w-full text-left text-xs">
          <thead class="bg-rose-50 text-pink-700 sticky top-0 z-10">
            <tr>
              <th class="px-3 py-2 whitespace-nowrap">Tgl Beli</th>
              <th class="px-3 py-2">Item</th>
              <th class="px-3 py-2 whitespace-nowrap text-center">Sisa Qty</th>
              <th class="px-3 py-2 text-center whitespace-nowrap">Pilih</th>
            </tr>
          </thead>
          <tbody id="tbody-grid-jual" class="divide-y divide-pink-50">
            <tr><td colspan="4" class="px-3 py-6 text-center text-gray-400">Belum ada data</td></tr>
          </tbody>
        </table>
      </div>
      <div class="p-4 border-t border-pink-50 flex-shrink-0">
        <button type="button" onclick="tutupGridJual()"
                class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-bold text-sm">
          Batalkan
        </button>
      </div>
    </div>
  </div>

</section>

<script>
  // Cache data master
  let dataMasterCache = { lokasi: [], kategori: [], platform: [], item: [] };
  let cacheRiwayatJual = [];
  let filterKategoriJual = 'semua'; // State filter modal jual

  // ============================================================
  // INISIALISASI MODUL
  // ============================================================
  function initModulTransaksi() {
    var localDate = new Date(new Date().getTime() - (new Date().getTimezoneOffset() * 60000))
                      .toISOString().split('T')[0];
    document.getElementById('klinik-tgl').value = localDate;
    document.getElementById('aset-tgl').value   = localDate;

    google.script.run
      .withSuccessHandler(function(data) {
        dataMasterCache = data;
        populateDropdowns();
      })
      .withFailureHandler(function(err) {
        Swal.fire('❌ Gagal Muat Data', 'getReferensiTransaksi: ' + err.message, 'error');
      })
      .getReferensiTransaksi();

    // COA dikelompokkan: karena Master Pengeluaran Rutin tidak punya kategori,
    // tampilkan flat diurutkan abjad
    google.script.run
      .withSuccessHandler(function(data) {
        var opsi = '<option value="" disabled selected>-- Pilih Akun Pengeluaran --</option>';
        if (data.length === 0) {
          opsi = '<option value="" disabled selected>⚠ Tambah data di Master Pengeluaran Rutin</option>';
        } else {
          // Urutkan abjad berdasarkan nama (index 1)
          data.sort(function(a, b) { return String(a[1]).localeCompare(String(b[1]), 'id'); });
          data.forEach(function(d) {
            // d = [ID, Nama, Nominal, Catatan]
            var nominal = parseInt(d[2] || 0).toLocaleString('id-ID');
            opsi += '<option value="' + d[1] + '">' + d[1] + ' — Rp' + nominal + '</option>';
          });
        }
        document.getElementById('aset-coa').innerHTML = opsi;
      })
      .withFailureHandler(function(err) {
        console.warn('COA gagal dimuat:', err.message);
      })
      .getReferensiArusKas();
  }

  // ============================================================
  // POPULATE DROPDOWNS — GROUPED BY CATEGORY
  // [REQ #1 FIX] Semua dropdown yang punya kategori pakai <optgroup>
  // ============================================================
  function populateDropdowns() {
    // --- Dropdown Lokasi Klinik: tidak punya kategori → urutkan abjad ---
    var lokasiSorted = dataMasterCache.lokasi.slice().sort(function(a, b) {
      return String(a[1]).localeCompare(String(b[1]), 'id');
    });
    var cbKlinik = '<option value="" disabled selected>-- Pilih Lokasi --</option>';
    if (lokasiSorted.length === 0) {
      cbKlinik = '<option value="" disabled selected>⚠ Tambah data di Master Lokasi</option>';
    } else {
      lokasiSorted.forEach(function(k) {
        var objVal = JSON.stringify({
          nama: k[1],
          komisi: parseFloat(k[2]) || 0,
          cutoff: parseInt(k[3]) || 25,
          tarifBpjs: parseFloat(k[4]) || 0
        });
        var safeVal = objVal.replace(/'/g, '&#39;');
        cbKlinik += '<option value=\'' + safeVal + '\'>' + k[1] + '</option>';
      });
    }
    document.getElementById('klinik-lokasi').innerHTML = cbKlinik;

    // --- Dropdown Platform: tidak punya kategori → urutkan abjad ---
    var platformSorted = dataMasterCache.platform.slice().sort(function(a, b) {
      return String(a[1]).localeCompare(String(b[1]), 'id');
    });
    var cbPlatform = '<option value="" disabled selected>-- Pilih Platform --</option>';
    if (platformSorted.length === 0) {
      cbPlatform = '<option value="" disabled selected>⚠ Tambah data di Master Platform</option>';
    } else {
      platformSorted.forEach(function(p) {
        cbPlatform += '<option value="' + p[1] + '">' + p[1] + '</option>';
      });
    }
    document.getElementById('aset-platform').innerHTML = cbPlatform;

    // --- Dropdown Kategori: tidak punya parent kategori → urutkan abjad ---
    var kategoriSorted = dataMasterCache.kategori.slice().sort(function(a, b) {
      return String(a[1]).localeCompare(String(b[1]), 'id');
    });
    var cbKat = '<option value="" disabled selected>-- Pilih Kategori --</option>';
    if (kategoriSorted.length === 0) {
      cbKat = '<option value="" disabled selected>⚠ Tambah data di Master Kategori</option>';
    } else {
      kategoriSorted.forEach(function(k) {
        cbKat += '<option value="' + k[1] + '">' + k[1] + '</option>';
      });
    }
    document.getElementById('aset-kategori').innerHTML = cbKat;

    // Item dikosongkan, diisi setelah user pilih kategori
    document.getElementById('aset-item').innerHTML =
      '<option value="" disabled selected>← Pilih Kategori dulu</option>';
  }

  // ============================================================
  // FILTER ITEM BERDASARKAN KATEGORI
  // Item sudah terkelompok karena user sudah pilih kategori duluan,
  // tapi tetap urutkan abjad di dalam kategori yang dipilih
  // ============================================================
  function filterItemBerdasarkanKategori() {
    var katTerpilih = document.getElementById('aset-kategori').value;
    var cbItem = document.getElementById('aset-item');

    // dataMasterCache.item = [[ID, Kategori, NamaItem], ...]
    var itemSesuai = dataMasterCache.item
      .filter(function(i) { return i[1] === katTerpilih; })
      .sort(function(a, b) { return String(a[2]).localeCompare(String(b[2]), 'id'); });

    if (itemSesuai.length === 0) {
      cbItem.innerHTML = '<option value="" disabled selected>⚠ Belum ada item di kategori ini</option>';
    } else {
      var opsi = '<option value="" disabled selected>-- Pilih Item --</option>';
      itemSesuai.forEach(function(i) {
        opsi += '<option value="' + i[2] + '">' + i[2] + '</option>';
      });
      cbItem.innerHTML = opsi;
    }
  }

  // ============================================================
  // GANTI MODE TRX
  // ============================================================
  function gantiModeTrx() {
    var mode = document.getElementById('pilihModeTrx').value;
    document.getElementById('form-klinik-container').classList.toggle('hidden', mode !== 'klinik');
    document.getElementById('form-aset-container').classList.toggle('hidden', mode !== 'aset');
  }

  // ============================================================
  // FORMAT ANGKA VISUAL
  // ============================================================
  function formatVisualAngka(elVisual, idRaw) {
    var raw = elVisual.value.replace(/[^0-9]/g, '');
    if (raw === '') raw = '0';
    document.getElementById(idRaw).value = raw;
    elVisual.value = raw !== '0' ? parseInt(raw).toLocaleString('id-ID') : '';
  }

  function formatRp(angka) {
    return new Intl.NumberFormat('id-ID', {
      style: 'currency', currency: 'IDR', minimumFractionDigits: 0
    }).format(angka);
  }

  // ============================================================
  // LOGIKA KLINIK
  // ============================================================
  function toggleBPJS() {
    var klinikVal = document.getElementById('klinik-lokasi').value;
    var isBPJS    = document.getElementById('klinik-bpjs').checked;
    var inputVisual = document.getElementById('klinik-omset-visual');
    var inputRaw    = document.getElementById('klinik-omset-raw');

    if (isBPJS && !klinikVal) {
      Swal.fire('Oops!', 'Pilih lokasi klinik terlebih dahulu.', 'warning');
      document.getElementById('klinik-bpjs').checked = false;
      return;
    }

    if (isBPJS) {
      var tarif = JSON.parse(klinikVal).tarifBpjs || 0;
      inputRaw.value     = tarif;
      inputVisual.value  = parseInt(tarif).toLocaleString('id-ID');
      inputVisual.readOnly = true;
      inputVisual.classList.add('bg-gray-100', 'text-gray-500', 'cursor-not-allowed');
    } else {
      inputRaw.value     = '0';
      inputVisual.value  = '';
      inputVisual.readOnly = false;
      inputVisual.classList.remove('bg-gray-100', 'text-gray-500', 'cursor-not-allowed');
    }
    kalkulasiKlinik();
  }

  function kalkulasiKlinik() {
    var klinikVal = document.getElementById('klinik-lokasi').value;
    var isBPJS    = document.getElementById('klinik-bpjs').checked;

    var persen = 0, cutoff = 0, tarifBpjs = 0;
    if (klinikVal) {
      var obj   = JSON.parse(klinikVal);
      persen    = parseFloat(obj.komisi)    || 0;
      cutoff    = parseInt(obj.cutoff)      || 25;
      tarifBpjs = parseFloat(obj.tarifBpjs) || 0;
    }

    if (isBPJS && klinikVal) {
      document.getElementById('klinik-omset-raw').value    = tarifBpjs;
      document.getElementById('klinik-omset-visual').value = parseInt(tarifBpjs).toLocaleString('id-ID');
    }

    var omset = parseFloat(document.getElementById('klinik-omset-raw').value) || 0;
    var nom   = 0, laba = 0;

    if (isBPJS) {
      nom  = omset;
      laba = 0;
      document.getElementById('txt-persen-klinik').innerText = 'Flat';
    } else {
      nom  = omset * (persen / 100);
      laba = omset - nom;
      document.getElementById('txt-persen-klinik').innerText = persen;
    }

    document.getElementById('txt-nominal-klinik').innerText   = formatRp(nom);
    document.getElementById('txt-laba-klinik').innerText      = formatRp(laba);
    document.getElementById('val-persen-klinik').value        = isBPJS ? 0 : persen;
    document.getElementById('val-nominal-klinik').value       = nom;
    document.getElementById('val-laba-klinik').value          = laba;
    document.getElementById('val-cutoff-klinik').value        = cutoff;
  }

  function submitTrxKlinik(e) {
    e.preventDefault();
    if (!document.getElementById('klinik-lokasi').value) {
      return Swal.fire('Oops!', 'Pilih lokasi klinik terlebih dahulu.', 'warning');
    }

    var btn = document.getElementById('btn-submit-klinik');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
    btn.disabled  = true;

    var pasienNama = document.getElementById('klinik-pasien').value;
    if (document.getElementById('klinik-bpjs').checked) pasienNama += ' (BPJS)';

    var payload = {
      tanggal:       document.getElementById('klinik-tgl').value,
      klinik:        JSON.parse(document.getElementById('klinik-lokasi').value).nama,
      pasien:        pasienNama,
      tindakan:      document.getElementById('klinik-tindakan').value || '-',
      omset:         document.getElementById('klinik-omset-raw').value,
      persenKomisi:  document.getElementById('val-persen-klinik').value,
      nominalKomisi: document.getElementById('val-nominal-klinik').value,
      labaBersih:    document.getElementById('val-laba-klinik').value,
      cutoff:        document.getElementById('val-cutoff-klinik').value
    };

    google.script.run
      .withSuccessHandler(function(res) {
        Swal.fire({ title: '✅ Tersimpan!', text: res, icon: 'success' });
        document.getElementById('klinik-pasien').value        = '';
        document.getElementById('klinik-tindakan').value      = '';
        document.getElementById('klinik-omset-visual').value  = '';
        document.getElementById('klinik-omset-raw').value     = '0';
        document.getElementById('klinik-bpjs').checked        = false;
        toggleBPJS();
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Fee Klinik';
        btn.disabled  = false;
      })
      .withFailureHandler(function(err) {
        Swal.fire({ title: '❌ Gagal Menyimpan!', text: err.message, icon: 'error' });
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Fee Klinik';
        btn.disabled  = false;
      })
      .simpanTrxKlinik(payload);
  }

  // ============================================================
  // LOGIKA TABUNGAN ASET — MODAL JUAL
  // ============================================================
  function bukaGridJual() {
    document.getElementById('area-coa-aset').classList.add('hidden');
    filterKategoriJual = 'semua';
    document.getElementById('modal-grid-jual').classList.remove('hidden');
    document.getElementById('tbody-grid-jual').innerHTML =
      '<tr><td colspan="4" class="px-3 py-6 text-center text-gray-400">' +
      '<i class="fa-solid fa-spinner fa-spin text-pink-500 mb-2 text-xl block"></i> Memuat riwayat beli...</td></tr>';

    google.script.run
      .withSuccessHandler(function(data) {
        cacheRiwayatJual = data;
        buatChipKategoriJual(data);
        renderGridJual(data);
      })
      .withFailureHandler(function(err) {
        document.getElementById('tbody-grid-jual').innerHTML =
          '<tr><td colspan="4" class="px-3 py-4 text-center text-red-500 font-bold">❌ ' + err.message + '</td></tr>';
      })
      .getRiwayatBeliAktif();
  }

  // Buat chip filter kategori untuk modal jual
  function buatChipKategoriJual(data) {
    var kategoris = [];
    data.forEach(function(d) {
      if (d.kategori && kategoris.indexOf(d.kategori) === -1) {
        kategoris.push(d.kategori);
      }
    });
    kategoris.sort(function(a, b) { return a.localeCompare(b, 'id'); });

    var chipContainer = document.getElementById('jual-chips-kategori');
    var html = '';
    kategoris.forEach(function(kat) {
      html += '<button onclick="filterGridJual(\'' + kat.replace(/'/g, "\\'") + '\')" ' +
              'id="jual-chip-' + kat.replace(/[^a-zA-Z0-9]/g, '') + '" ' +
              'class="flex-shrink-0 text-[11px] font-bold px-3 py-1.5 rounded-full border bg-white text-pink-600 border-pink-200 transition-colors">' +
              kat + '</button>';
    });
    chipContainer.innerHTML = html;
  }

  function filterGridJual(kategori) {
    filterKategoriJual = kategori;

    // Update chip visual
    var semua = document.getElementById('jual-chip-semua');
    if (semua) {
      semua.className = 'flex-shrink-0 text-[11px] font-bold px-3 py-1.5 rounded-full border transition-colors ' +
        (kategori === 'semua' ? 'bg-pink-600 text-white border-pink-600' : 'bg-white text-pink-600 border-pink-200');
    }
    cacheRiwayatJual.forEach(function(d) {
      var id = 'jual-chip-' + (d.kategori || '').replace(/[^a-zA-Z0-9]/g, '');
      var el = document.getElementById(id);
      if (el) {
        el.className = 'flex-shrink-0 text-[11px] font-bold px-3 py-1.5 rounded-full border transition-colors ' +
          (d.kategori === kategori ? 'bg-pink-600 text-white border-pink-600' : 'bg-white text-pink-600 border-pink-200');
      }
    });

    var filtered = kategori === 'semua' ? cacheRiwayatJual :
      cacheRiwayatJual.filter(function(d) { return d.kategori === kategori; });
    renderGridJual(filtered);
  }

  function tutupGridJual() {
    document.getElementById('modal-grid-jual').classList.add('hidden');
    if (document.getElementById('val-id-referensi').value === '') {
      document.querySelector('input[name="aset-tipe"][value="BELI"]').checked = true;
      resetFormBeli();
    }
  }

  function renderGridJual(data) {
    var tbody = document.getElementById('tbody-grid-jual');
    if (data.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="4" class="px-3 py-8 text-center text-gray-400">' +
        '<i class="fa-solid fa-inbox text-pink-300 text-2xl block mb-2"></i>' +
        '<span class="font-bold text-xs">Tidak ada aset yang bisa dijual.</span>' +
        '<br><span class="text-[10px]">Pastikan sudah ada transaksi BELI yang tercatat.</span></td></tr>';
      return;
    }

    var html = '';
    data.forEach(function(d) {
      // Format tampilan tanggal & harga beli
      var tglDisplay = d.tanggal || '-';
      var hargaDisplay = d.hargaBeli > 0
        ? '<span class="text-[9px] text-pink-500">@' + parseInt(d.hargaBeli).toLocaleString('id-ID') + '</span>'
        : '';
      html +=
        '<tr class="hover:bg-rose-50 transition-colors">' +
          '<td class="px-3 py-3 text-[10px] font-mono text-gray-500 whitespace-nowrap">' + tglDisplay + '</td>' +
          '<td class="px-3 py-3">' +
            '<span class="font-bold text-slate-700 block text-[11px] max-w-[110px] truncate">' + d.item + '</span>' +
            '<span class="text-[9px] text-pink-600 bg-pink-50 px-1 py-0.5 rounded border border-pink-100 mr-1">' + d.platform + '</span>' +
            hargaDisplay +
          '</td>' +
          '<td class="px-3 py-3 text-center">' +
            '<span class="font-bold text-rose-900 text-xs">' + d.sisaQty + '</span>' +
          '</td>' +
          '<td class="px-3 py-3 text-center whitespace-nowrap">' +
            '<button type="button" data-id="' + d.id + '" onclick="pilihLotJual(this)" ' +
            'class="bg-pink-500 hover:bg-pink-600 active:bg-pink-700 text-white font-bold px-3 py-1.5 rounded-lg text-[10px] shadow-sm">' +
            'Pilih</button>' +
          '</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
  }

  function pilihLotJual(btnElement) {
    var idTarget = btnElement.getAttribute('data-id');
    var d = cacheRiwayatJual.find(function(item) {
      return String(item.id) === String(idTarget);
    });

    if (!d) {
      Swal.fire('Error', 'Data aset tidak ditemukan (ID: ' + idTarget + ')', 'error');
      return;
    }

    var lockClass = 'w-full border border-gray-200 py-3 px-3 rounded-xl outline-none text-sm bg-gray-100 text-gray-500 cursor-not-allowed pointer-events-none';

    document.getElementById('aset-platform').innerHTML = '<option value="' + d.platform + '" selected>' + d.platform + '</option>';
    document.getElementById('aset-kategori').innerHTML = '<option value="' + d.kategori + '" selected>' + d.kategori + '</option>';
    document.getElementById('aset-item').innerHTML     = '<option value="' + d.item     + '" selected>' + d.item     + '</option>';

    ['aset-platform', 'aset-kategori', 'aset-item'].forEach(function(f) {
      document.getElementById(f).removeAttribute('required');
      document.getElementById(f).className = lockClass;
    });

    document.getElementById('aset-kuantitas').max         = d.sisaQty;
    document.getElementById('aset-kuantitas').placeholder = 'Max: ' + d.sisaQty;
    document.getElementById('aset-kuantitas').value       = '';
    document.getElementById('aset-total-visual').value    = '';
    document.getElementById('aset-total-raw').value       = '0';
    document.getElementById('txt-harga-satuan').innerText = 'Rp 0';
    document.getElementById('val-harga-satuan').value     = '0';
    kalkulasiAset();

    document.getElementById('val-id-referensi').value = d.id;
    document.getElementById('modal-grid-jual').classList.add('hidden');

    // Tampilkan info lot yang dipilih
    Swal.fire({
      title: '✅ Lot Dipilih',
      html: '<div class="text-left text-sm">' +
            '<p><b>Item:</b> ' + d.item + '</p>' +
            '<p><b>Platform:</b> ' + d.platform + '</p>' +
            '<p><b>Sisa Qty:</b> ' + d.sisaQty + '</p>' +
            '<p><b>Harga Beli:</b> Rp' + parseInt(d.hargaBeli).toLocaleString('id-ID') + '</p>' +
            '</div>',
      icon: 'info',
      timer: 2500,
      showConfirmButton: false
    });
  }

  function resetFormBeli() {
    document.getElementById('area-coa-aset').classList.remove('hidden');

    var normalClass = 'w-full bg-rose-50 border border-pink-200 py-3 px-3 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none text-sm';
    ['aset-platform', 'aset-kategori', 'aset-item'].forEach(function(f) {
      document.getElementById(f).setAttribute('required', 'true');
      document.getElementById(f).className = normalClass;
    });

    populateDropdowns();
    document.getElementById('aset-kuantitas').removeAttribute('max');
    document.getElementById('aset-kuantitas').placeholder = 'Misal: 10';
    document.getElementById('val-id-referensi').value    = '';
    document.getElementById('txt-harga-satuan').innerText = 'Rp 0';
    document.getElementById('val-harga-satuan').value     = '0';
  }

  function kalkulasiAset() {
    var qty   = parseFloat(document.getElementById('aset-kuantitas').value)  || 0;
    var total = parseFloat(document.getElementById('aset-total-raw').value)  || 0;
    var max   = document.getElementById('aset-kuantitas').getAttribute('max');

    if (max !== null && qty > parseFloat(max)) {
      Swal.fire('Stok Kurang', 'Kuantitas maksimal yang bisa dijual: ' + max, 'warning');
      document.getElementById('aset-kuantitas').value = max;
      qty = parseFloat(max);
    }

    var hargaSatuan = qty > 0 ? total / qty : 0;
    document.getElementById('txt-harga-satuan').innerText = formatRp(hargaSatuan);
    document.getElementById('val-harga-satuan').value     = hargaSatuan;
  }

  function submitTrxAset(e) {
    e.preventDefault();

    var tipe   = document.querySelector('input[name="aset-tipe"]:checked').value;
    var coaKas = document.getElementById('aset-coa').value;

    if (tipe === 'BELI' && !coaKas) {
      return Swal.fire('Oops!', 'Pilih Akun Biaya (COA) untuk transaksi pembelian aset.', 'warning');
    }

    // Validasi ID referensi untuk JUAL
    var idRef = document.getElementById('val-id-referensi').value;
    if (tipe === 'JUAL' && (!idRef || idRef === '')) {
      return Swal.fire('Oops!', 'Pilih lot aset yang akan dijual terlebih dahulu.', 'warning');
    }

    var btn = document.getElementById('btn-submit-aset');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
    btn.disabled  = true;

    var payload = {
      tanggal:     document.getElementById('aset-tgl').value,
      tipe:        tipe,
      platform:    document.getElementById('aset-platform').value,
      kategori:    document.getElementById('aset-kategori').value,
      item:        document.getElementById('aset-item').value,
      kuantitas:   document.getElementById('aset-kuantitas').value,
      total:       document.getElementById('aset-total-raw').value,
      harga:       document.getElementById('val-harga-satuan').value,
      idReferensi: idRef || '-',
      coaKas:      coaKas || ''
    };

    google.script.run
      .withSuccessHandler(function(res) {
        Swal.fire({ title: '✅ Tersimpan!', text: res, icon: 'success' });
        document.getElementById('formAset').reset();
        document.getElementById('aset-tgl').value             = payload.tanggal;
        document.getElementById('aset-total-raw').value       = '0';
        document.getElementById('txt-harga-satuan').innerText = 'Rp 0';
        document.getElementById('val-harga-satuan').value     = '0';
        document.querySelector('input[name="aset-tipe"][value="BELI"]').checked = true;
        resetFormBeli();
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Transaksi Aset';
        btn.disabled  = false;
      })
      .withFailureHandler(function(err) {
        Swal.fire({ title: '❌ Gagal Menyimpan!', text: err.message, icon: 'error' });
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Transaksi Aset';
        btn.disabled  = false;
      })
      .simpanTrxAset(payload);
  }
</script>
